name: rotular-manutencao

# Aplica as labels falha:*, prioridade:* e flaky a partir do formulário de manutenção.
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Número da issue de manutenção que deve ser rotulada
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: rotular-manutencao-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  rotular:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.body, '### Tipo de falha')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sincronizar labels
        run: node .github/scripts/rotular-manutencao.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
