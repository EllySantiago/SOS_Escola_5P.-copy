name: Testes

# Regressão completa da TAS: testes unitários, de API e E2E num job só. Disparo manual.
on:
  workflow_dispatch:

jobs:
  regressao:
    name: Regressão completa
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: soscidade
          POSTGRES_HOST_AUTH_METHOD: trust # banco descartável do job, sem senha
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/soscidade
      DIRECT_URL: postgresql://postgres@localhost:5432/soscidade
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Gerar chaves de teste
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e
          cd e2e && npx playwright install --with-deps chromium

      - name: Preparar banco (migrations e seed)
        working-directory: backend
        run: npx prisma migrate deploy && npx prisma db seed

      - name: Subir backend e frontend
        run: |
          npm run build --prefix backend
          (cd backend && nohup node dist/server.js > backend.log 2>&1 &)
          npm run build --prefix frontend
          (cd frontend && nohup npm start > frontend.log 2>&1 &)
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:3000/login; do sleep 1; done'

      - name: Testes Unitários
        run: npm run test:unit

      - name: Testes de API
        if: ${{ !cancelled() }}
        run: npm run test:api

      - name: Testes End-to-End (E2E)
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - name: Relatório E2E (só em falha)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-e2e
          path: e2e/playwright-report/
